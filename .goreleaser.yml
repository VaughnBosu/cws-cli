version: 2

project_name: cws

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/vaughnbosu/cws-cli/cmd.Version={{.Version}}
    main: ./cmd/cws

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: cws
    binaries:
      - cws
    repository:
      owner: vaughnbosu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://vaughnbosu.github.io/cws-cli/"
    description: "A CLI for managing Chrome Web Store extensions"
    license: "MIT"
    # Homebrew 7 deprecated `postflight` for `postflight_steps`, which
    # hooks.post.install can't emit yet (goreleaser/goreleaser#6870).
    # {{staged_path}} is Homebrew's token, escaped from GoReleaser's templating.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/cws"]
        end
      end

release:
  github:
    owner: vaughnbosu
    name: cws-cli
