version: 2

project_name: cws

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/vaughnbosu/cws-cli/cmd.Version={{.Version}}
    main: ./cmd/cws

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: cws
    binaries:
      - cws
    repository:
      owner: vaughnbosu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    url:
      verified: github.com/vaughnbosu/cws-cli/
    homepage: "https://vaughnbosu.github.io/cws-cli/"
    description: "A CLI for managing Chrome Web Store extensions"
    license: "MIT"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cws"]
          end

release:
  github:
    owner: vaughnbosu
    name: cws-cli
